{cat:'戰鬥',title:'推圖卡住了：先檢查什麼？',level:'全部世界',body:['命中不足會讓實際傷害和擊殺效率遠低於表面值。','食物補給、最大生命、防禦與 AFK 存活率都可能限制推圖。','先比較每小時擊殺量與解鎖傳送門需求，不要只盯角色面板傷害。','優先查印章、煉金、卡片、星座、裝備升級石與跨世界乘區。'],source:'https://idleontoolbox.com/'},
{cat:'養成',title:'印章、雕像、卡片怎麼投資？',level:'W1+',body:['印章與雕像提供廣泛長期收益；依素材成本和加成範圍決定升級順序。','打怪卡片可以選擇符合當下目標的配置；主動推圖與採集使用不同組合。','不要為了短期數值耗盡所有稀缺素材：許多道具後續另有用途。','定期使用 Toolbox 檢查可快速補上的缺口。'],source:'https://idleon.wiki/'},
{cat:'養成',title:'煉金 Alchemy 長期升級策略',level:'W2+',body:['讓大泡泡、藥水瓶等核心機制提早運作。','優先投資對採集效率、資源供給、戰鬥與成長率有實際效果的項目。','能不斷印出煉金材料之後，升級成本曲線會完全改變；不要沿用新手期排序。','每次卡關回頭檢查煉金，通常比盲目換裝更有價值。'],source:'https://idleontoolbox.com/'},
{cat:'養成',title:'3D Printer 採樣與精煉',level:'W3+',body:['印表機讓角色不必一直守著單一資源點，是長期資源自動化核心。','採樣前切換對應天賦、工具、卡片與採集加成，並記錄採樣結果。','精煉需要穩定的上游材料；計畫升級前先檢查供應。','新的帳號加成會使舊採樣落後，應適時重新採樣。'],source:'https://idleontoolbox.com/'},
{cat:'養成',title:'實驗室、神性與角色配置',level:'W4–W5',body:['角色長時間待在實驗室有機會成本，應比較被動收益與其他工作產值。','神性與實驗室的互動會改變最佳分配；新手和成熟帳號的答案不同。','先確保重要節點實際生效，再考慮提高各種上限。','進世界後不需立即把所有角色丟進新系統，保留推圖角色。'],source:'https://idleontoolbox.com/'},
{cat:'養成',title:'烹飪與寵物培育循環',level:'W4+',body:['Cooking 解鎖新菜餚並累積長期增益，Breeding 可為料理與其他玩法提供助力。','先建立可以穩定提升速度與新食譜發現率的基礎，不要只盯最高等料理。','寵物配隊、技能和戰鬥策略會受更新影響，請核對最新社群攻略。'],source:'https://idleon.wiki/'},
{cat:'養成',title:'航海、遊戲機、神性基本方向',level:'W5+',body:['Sailing 著重船隻產能、探索與神器取得。','Gaming 需要長期累積與升級，而不是只在剛解鎖時玩一次。','Divinity 關係角色配置及跨系統加成，適合和實驗室一起檢視。'],source:'https://gist.github.com/shnaps/161a370ed795e6141e0553eb30ddc8fa'},
{cat:'養成',title:'W6：潛行、召喚、農耕',level:'W6+',body:['Sneaking 通常要在進度、成功率及道具能力之間取得平衡。','Summoning 的關卡勝利帶來長期獎勵；用實際解鎖需求安排戰鬥。','Farming 以作物、土地及升級的循環為主，盡早讓各項產能運作。','版本變化大，具體最優數值及隊伍配置要用當期工具核對。'],source:'https://idleon.wiki/'},
{cat:'養成',title:'W7：Research 與 Spelunking',level:'W7',body:['Research 是觀測與研究成長循環；初期應先理解解鎖、成功機率與研究效率。','Spelunking 是主動探索與放置收益結合的玩法，體力、力量、資源回收很重要。','部分關卡、裝備與成長係數可能持續擴充；以 Wiki 和近期更新為準。'],source:'https://gist.github.com/shnaps/161a370ed795e6141e0553eb30ddc8fa'},
{cat:'管理',title:'每天、每週應該做什麼？',level:'全部世界',body:['每日：領取或更新有限次數資源，維持可累積系統運作。','每週：檢查副本、特殊活動與有週期限制的內容。','每次推到新世界：立刻開啟新系統，回頭更新舊世界乘區。','不要為了清單耗盡遊戲興趣；把每日項目調整成個人可持續的節奏。'],source:'https://idleonchecklist.com/'},
{cat:'管理',title:'如何用 AutoReview 找出帳號弱點？',level:'W2–W7',body:['先用 Idleon Toolbox 或 Efficiency 檢查帳號狀態，依工具官方說明匯出必要資料。','在 AutoReview 中查看各世界各系統的分級與待改善項。','先做低成本、帳號通用的提升，再處理昂貴而局部的項目。','第三方網站不由本站管理；請自行評估帳號登入及資料分享風險。'],source:'https://ieautoreview-scoli.pythonanywhere.com/'},
{cat:'管理',title:'什麼才算畢業？',level:'終局',body:['Idleon 是持續更新且可長期養成的放置遊戲，沒有永久通用的「全滿」門檻。','可自訂階段目標：解鎖全部世界、主線 Boss 通關、所有長期生產系統穩定。','後期用每小時資源、列印量、採集效率、掉落率和帳號總乘區衡量實際進步。','以有限時間換最大的成長，是比無止盡刷滿單一項目更實用的終局策略。'],source:'https://idleontoolbox.com/'}
];
const resources=[['IdleOn MMO Wiki','最完整的怪物、物品、任務、掉落與遊戲機制原始資料','https://idleon.wiki/','百科'],['Idleon Toolbox','帳號追蹤、天賦配點、卡片、裝備與系統分析','https://idleontoolbox.com/','工具'],['Idleon Efficiency','另一套帳號分析與印章、裝備進度查詢工具','https://www.idleonefficiency.com/','工具'],['IE AutoReview','依帳號資料產出各世界養成優先級建議','https://ieautoreview-scoli.pythonanywhere.com/','工具'],['W1–W7 Progression Guide','涵蓋全部七個世界的英文階段式攻略；W7 數值需核對','https://gist.github.com/shnaps/161a370ed795e6141e0553eb30ddc8fa','攻略'],['Idleon Hub','彙整外國社群常用的工具、指南與 Discord','https://idleonhub.com/','索引'],['Idleon Checklist','重置週期、每日與每週活動清單','https://idleonchecklist.com/','工具'],['Idleon Insight','可搜尋遊戲資料、增益與物品來源','https://idleoninsight.com/','查詢'],['Arkh Idleon Trackers','社群整理的試算表與特殊計算工具目錄','https://arkh-idleon-trackers.vercel.app/sheets','資料'],['台灣巴哈新手攻略','2026 年台灣玩家分享的中文新手與避坑心得','https://forum.gamer.com.tw/C.php?bsn=72789&snA=54','中文']];
const dailies=['領取 / 檢查鍛造產出','檢查煉金與印章可提升項','確認 3D 列印、精煉是否持續','領取陷阱資源，使用祭拜充能','檢查培育、料理與實驗室','檢查航海、Gaming、神性進度','檢查潛行、召喚、農耕進度','查看研究、洞窟探索可取得獎勵','確認角色 AFK 地點和背包容量'];
const classes=[['⚔️','Warrior 戰士','Barbarian → Blood Berserker / Death Bringer','Squire → Divine Knight'],['🏹','Archer 弓箭手','Bowman → Siege Breaker / Wind Walker','Hunter → Beast Master'],['🔮','Mage 法師','Shaman → Bubonic Conjuror','Wizard → Elemental Sorcerer / Arcane Cultist'],['🃏','特殊路線','Journeyman → Maestro → Voidwalker','屬於特殊任務解鎖路線，勿隨意轉職']];
let page='home',currentWorld=1,guideFilter='全部';const get=(k,f)=>{try{return JSON.parse(localStorage.getItem(k))??f}catch{return f}};let checked=get('idleon-zh-checks',{}),daily=get('idleon-zh-daily',{});const save=()=>{localStorage.setItem('idleon-zh-checks',JSON.stringify(checked));localStorage.setItem('idleon-zh-daily',JSON.stringify(daily))};const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const done=(w)=>w.tasks.filter((_,i)=>checked[`w${w.id}-${i}`]).length;const count=()=>worlds.reduce((a,w)=>a+done(w),0);const percent=w=>Math.round(done(w)/w.tasks.length*100);
function go(p,id){page=p;if(id)currentWorld=id;document.getElementById('search').value='';render();window.scrollTo({top:0,behavior:'smooth'});document.querySelector('.side').classList.remove('open')}function nav(){const items=[['home','⌂','冒險總覽'],['worlds','◈','世界進度 W1–W7'],['guides','▤','主題攻略百科'],['classes','♟','職業成長路線'],['daily','☑','每日養成清單'],['resources','↗','國外資源資料庫'],['account','◉','我的帳號資料'],['backup','⇄','進度備份']];document.getElementById('nav').innerHTML=items.map(([id,ic,t])=>`<button class="nav ${page===id||(page==='world'&&id==='worlds')?'active':''}" onclick="go('${id}')"><b style="width:20px;font-size:18px">${ic}</b>${t}</button>`).join('')}
function card(w){return `<button class="worldcard" onclick="go('world',${w.id})"><div class="num">WORLD ${String(w.id).padStart(2,'0')}</div><div class="glyph">${w.emoji}</div><h3>${w.zh}</h3><p>${w.name} · ${w.stage}</p><div class="progress"><i style="width:${percent(w)}%"></i></div><div class="foot"><span>${done(w)} / ${w.tasks.length} 里程碑</span><span>${percent(w)}%</span></div></button>`}
function worldList(){return `<div class="section-head"><h2>七大世界探索路線</h2><p>選擇世界，查看核心系統與里程碑 →</p></div><div class="worldgrid">${worlds.map(card).join('')}</div>`}
function home(){return `<section class="hero"><span class="pill">2026 · 繁體中文玩家導航</span><h1>從第一隻角色，<br>一路成長到世界七。</h1><p>不用在幾十份英文攻略中迷路。把世界推進、跨角色養成、系統教學、職業規劃和外部工具整理成一張能完成的冒險地圖。</p><div class="hero-actions"><button class="btn" onclick="go('worlds')">開始冒險 →</button><button class="btn sec" onclick="go('guides')">查閱攻略百科</button></div></section><div class="stats"><div class="stat"><span>世界開放</span><strong>7</strong><span>W1 — W7</span></div><div class="stat"><span>攻略專題</span><strong>${guides.length}</strong><span>分類摘要與來源</span></div><div class="stat"><span>總里程碑</span><strong>${worlds.reduce((n,w)=>n+w.tasks.length,0)}</strong><span>可儲存完成狀態</span></div><div class="stat"><span>個人完成進度</span><strong>${Math.round(count()/worlds.reduce((n,w)=>n+w.tasks.length,0)*100)}%</strong><span>${count()} 項已完成</span></div></div>${worldList()}<div class="section-head"><h2>現在不知道該做什麼？</h2></div><div class="twocol"><div class="panel"><h3>📍 依目前世界安排優先級</h3><p>先開啟當前世界的永久生產系統，保留一隻主推圖角；舊世界的印章、煉金、列印與其他帳號加成要持續成長。</p><div class="filters">${worlds.map(w=>`<button class="filter ${currentWorld===w.id?'active':''}" onclick="currentWorld=${w.id};render()">W${w.id}</button>`).join('')}</div><p style="margin-bottom:6px;color:#e9f4ff"><b>W${currentWorld}｜${worlds[currentWorld-1].stage}</b></p><p>${worlds[currentWorld-1].intro}</p><button class="btn" onclick="go('world',${currentWorld})">查看 W${currentWorld} 待辦</button></div><div class="panel"><h3>🧭 三個最重要的原則</h3><div class="checkrow"><span>01</span><div><b>推圖 ≠ 全部進度</b><small>一個帳號的成長來自多個世界永久加成疊加。</small></div></div><div class="checkrow"><span>02</span><div><b>新系統越早運轉越有利</b><small>煉金、3D 列印、烹飪、航海等都需要時間累積。</small></div></div><div class="checkrow"><span>03</span><div><b>先解決最大瓶頸</b><small>命中、存活、素材供給或帳號增益，依實際數據判斷。</small></div></div></div></div>`}
function worldsPage(){return `<h1>世界探索地圖</h1><p>依照世界順序完成核心里程碑；你不需要把前一世界全部刷滿才前往下一個世界。</p>${worldList()}`}
function worldPage(){const w=worlds[currentWorld-1];return `<button class="filter" onclick="go('worlds')">← 返回世界總覽</button><div class="detail-head"><div class="bigglyph">${w.emoji}</div><div><span class="pill">WORLD ${w.id}</span><h1 style="margin:8px 0 4px">${w.zh}</h1><span class="muted">${w.name} · ${w.stage}</span></div></div><div class="twocol"><section><div class="panel"><div class="section-head" style="margin:0 0 13px"><h2>通關里程碑</h2><span class="mini">${done(w)} / ${w.tasks.length}</span></div><div class="progress"><i style="width:${percent(w)}%"></i></div>${w.tasks.map(([title,desc],i)=>`<div class="checkrow"><input type="checkbox" id="w${w.id}-${i}" ${checked[`w${w.id}-${i}`]?'checked':''} onchange="checked['w${w.id}-${i}']=this.checked;save();render()"><label for="w${w.id}-${i}" style="${checked[`w${w.id}-${i}`]?'opacity:.7':''}"><b>${esc(title)}</b><small>${esc(desc)}</small></label></div>`).join('')}</div></section><section><div class="panel"><h3>本世界核心重點</h3><p>${w.intro}</p><h3 style="margin-top:22px">核心系統</h3><div>${w.systems.map(s=>`<span class="chip">${s}</span>`).join('')}</div><h3 style="margin-top:25px">世界 Boss</h3><p><b style="color:#e9f3fa">${w.boss}</b></p><div class="note">這是可追蹤的養成路線，不是官方通關條件。遊戲持續更新，詳細門檻與數值請查 Wiki／Toolbox。</div></div><div class="panel" style="margin-top:15px"><h3>下一步</h3><p>每隔幾天回來核對一次里程碑，遇到瓶頸時把「傷害、命中、存活、資源產量」拆開檢查。</p><button class="btn sec" onclick="go('guides')">查看相關教學 →</button></div></section></div><div class="section-head"><h2>切換世界</h2></div><div class="filters">${worlds.map(x=>`<button class="filter ${x.id===w.id?'active':''}" onclick="go('world',${x.id})">W${x.id} ${x.emoji}</button>`).join('')}</div>`}
function guidesPage(search=''){let result=guides.filter(g=>(guideFilter==='全部'||g.cat===guideFilter)&&`${g.title} ${g.body.join(' ')} ${g.level}`.toLowerCase().includes(search.toLowerCase()));return `<h1>主題攻略百科</h1><p>每篇為中文原創整理的學習重點與操作方向，附上原始英文資料入口。不是全文翻譯，也不取代現行版本的精確數據。</p><div class="filters">${['全部','起步','戰鬥','養成','管理'].map(c=>`<button class="filter ${guideFilter===c?'active':''}" onclick="guideFilter='${c}';render()">${c}</button>`).join('')}</div>${result.map(g=>`<article class="article"><div class="meta">${esc(g.cat)} · ${esc(g.level)}</div><h3>${esc(g.title)}</h3><ul>${g.body.map(t=>`<li>${esc(t)}</li>`).join('')}</ul><a href="${g.source}" target="_blank" rel="noopener noreferrer">查看英文參考來源 ↗</a></article>`).join('')||'<div class="empty">沒有找到符合條件的教學。</div>'}`}
function classesPage(){return `<h1>職業成長路線</h1><p>先了解職業路線再轉職。以下整理主要進階方向，最新新增職業、分支解鎖條件及最優配點需以 Wiki 和 Toolbox 為準。</p><div class="resgrid">${classes.map(c=>`<div class="resource"><div style="font-size:35px;margin-bottom:10px">${c[0]}</div><h3>${c[1]}</h3><p>${c[2]}</p><p>${c[3]}</p></div>`).join('')}</div><div class="note">不要把「職業擅長的採集技能」理解成只能做一件事。中後期所有角色都會受到全帳號增益影響；角色配置也可能因新職業或新版本改變。</div><div class="panel"><h3>規劃職業的實用方法</h3><div class="timeline"><div class="step"><b>先分配三個基礎職業家族</b><p>不要一開始就讓全部角色走同一條路。</p></div><div class="step"><b>依世界需求決定進階路線</b><p>戰鬥推圖、採集效率、資源生產和全帳號輔助都是考量。</p></div><div class="step"><b>精英職業解鎖後建立各角色分工</b><p>選擇核心主動角色與支援角色，並視新版本調整。</p></div></div><a href="https://idleontoolbox.com/" target="_blank" rel="noopener noreferrer">打開 Toolbox 查看最新配點方案 ↗</a></div>`}
const today=()=>new Date().toLocaleDateString('sv-SE');function dailyPage(){let key=today(),v=daily[key]||{};return `<h1>每日養成清單</h1><p>這是一份可以自行選用的管理模板。未解鎖的世界可略過；狀態每天按本機日期分開保存。</p><div class="panel" style="max-width:800px"><div class="section-head" style="margin:0 0 14px"><h2>今日檢查</h2><span class="muted">${key} · ${Object.values(v).filter(Boolean).length}/${dailies.length}</span></div>${dailies.map((t,i)=>`<div class="checkrow"><input type="checkbox" id="d${i}" ${v[i]?'checked':''} onchange="(daily['${key}']??={})[${i}]=this.checked;save();render()"><label for="d${i}">${t}</label></div>`).join('')}<button class="btn sec" style="margin-top:18px" onclick="delete daily['${key}'];save();render()">重設今天勾選</button></div><div class="note">每天重置依你的裝置本地日期計算，不是遊戲伺服器重置時間。精確週期請使用 <a href="https://idleonchecklist.com/" target="_blank">Idleon Checklist</a>。</div>`}
function resourcesPage(search=''){let r=resources.filter(x=>x.join(' ').toLowerCase().includes(search.toLowerCase()));return `<h1>國外攻略與工具資源庫</h1><p>優先保留社群常用的百科、帳號分析器和攻略索引，讓中文導覽與外部即時資料相互搭配。</p><div class="resgrid">${r.map(x=>`<div class="resource"><span class="tag">${x[3]}</span><h3 style="margin-top:12px">${esc(x[0])}</h3><p>${esc(x[1])}</p><a class="out" href="${x[2]}" target="_blank" rel="noopener noreferrer">前往網站 ↗</a></div>`).join('')}</div><div class="note">第三方服務的登入、帳號存取、權限和網站可用性由各服務自行管理。本站不會代你登入或上傳遊戲資料。</div>`}
function backupPage(){return `<h1>個人進度備份</h1><p>所有勾選內容只會保存在此瀏覽器的 localStorage。換裝置、清除網站資料或用無痕模式，都可能失去紀錄。</p><div class="panel" style="max-width:730px"><h3>匯出與匯入進度</h3><p>你可以下載 JSON 備份，也可以從檔案還原 W1–W7 的里程碑與每日清單。</p><div class="hero-actions"><button class="btn" onclick="exportData()">↓ 下載 JSON 備份</button><label class="btn sec" style="cursor:pointer">↑ 匯入 JSON<input type="file" accept=".json,application/json" style="display:none" onchange="importData(this.files[0])"></label><button class="btn sec" onclick="if(confirm('確定要清除所有本機紀錄？')){checked={};daily={};save();render()}">清除進度</button></div></div>`}
function exportData(){let blob=new Blob([JSON.stringify({app:'idleon-zh',version:1,checked,daily},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='idleon-zh-progress.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(f){if(!f)return;try{let obj=JSON.parse(await f.text());if(obj.app!=='idleon-zh'||typeof obj.checked!=='object')throw Error('格式不符');checked=obj.checked||{};daily=obj.daily||{};save();render();alert('匯入成功')}catch(e){alert('無法匯入：'+e.message)}}
function render(){nav();const map={home:'首頁',worlds:'世界進度',world:'世界 '+currentWorld,guides:'主題攻略',classes:'職業導覽',daily:'每日清單',resources:'資源庫',backup:'資料備份',account:'我的帳號資料'};document.getElementById('location').textContent=map[page];const q=document.getElementById('search').value.trim();const app=document.getElementById('app');if(q){let ws=worlds.filter(w=>`${w.name}${w.zh}${w.systems.join('')}${w.intro}`.toLowerCase().includes(q.toLowerCase()));let gs=guides.filter(g=>`${g.title}${g.level}${g.body.join('')}`.toLowerCase().includes(q.toLowerCase()));let rs=resources.filter(r=>r.join('').toLowerCase().includes(q.toLowerCase()));app.innerHTML=`<h1>搜尋「${esc(q)}」</h1><p>找到 ${ws.length} 個世界、${gs.length} 篇攻略與 ${rs.length} 個資源。</p>${ws.length?`<div class="worldgrid">${ws.map(card).join('')}</div>`:''}${gs.map(g=>`<article class="article"><div class="meta">${esc(g.cat)} · ${esc(g.level)}</div><h3>${esc(g.title)}</h3><ul>${g.body.map(b=>`<li>${esc(b)}</li>`).join('')}</ul><a href="${g.source}" target="_blank">查看來源 ↗</a></article>`).join('')}${rs.map(r=>`<div class="article"><b>${esc(r[0])}</b> · ${esc(r[1])} <a href="${r[2]}" target="_blank">↗</a></div>`).join('')}${!(ws.length+gs.length+rs.length)?'<div class="empty">沒有相關結果，試試「煉金」、「W3」或「職業」。</div>':''}`;return}app.innerHTML=page==='home'?home():page==='worlds'?worldsPage():page==='world'?worldPage():page==='guides'?guidesPage():page==='classes'?classesPage():page==='daily'?dailyPage():page==='resources'?resourcesPage():page==='account'?accountPage():backupPage()};function accountPage(){return `<div class="hero"><span class="pill">帳號資料 · 測試版</span><h1>我的遊戲進度</h1><p>Google 登入只能驗證你在本網站的身份，不會直接取得 Idleon 存檔。目前支援 Firebase Google 登入設定，以及本機 JSON 讀取；遊戲資料自動同步尚未接通。</p></div><div class="panel"><h2>新版中文儀表板</h2><p>支援手機匯入 Toolbox Raw game data，顯示角色、主線、資源與世界系統概況。</p><div class="hero-actions"><a class="btn" href="./dashboard.html">開啟中文儀表板 →</a></div></div><div class="panel"><h2>① 連接 Google 登入</h2><p>到 <a href="https://console.firebase.google.com/" target="_blank">Firebase Console</a> 建立自己的專案，啟用 Authentication → Google，將 <code>t020195444.github.io</code> 加入 Authorized domains。貼上 Firebase Web App 的公開設定 JSON（不是私密金鑰）。</p><textarea id="fbCfg" style="width:100%;min-height:100px;padding:12px;background:#0b1727;color:white;border:1px solid #46637c;border-radius:8px" placeholder='{"apiKey":"...","authDomain":"...","projectId":"...","appId":"..."}'></textarea><div class="hero-actions"><button class="btn" onclick="initFb()">設定 Firebase</button><button class="btn sec" onclick="loginFb()">使用 Google 登入</button><button class="btn sec" onclick="logoutFb()">登出</button></div><p id="fbStatus" role="status">尚未設定 Firebase。</p></div><div class="panel" style="margin-top:16px"><h2>② 匯入 Idleon JSON 存檔</h2><p>從可信賴來源自行匯出 JSON，本站只在瀏覽器讀取，不會上傳伺服器；目前只檢查資料欄位，尚無完整解析各技能等級的功能。</p><input id="idleonFile" type="file" accept=".json,application/json"><div class="hero-actions"><button class="btn" onclick="importIdleon()">本機讀取 JSON</button><button class="btn sec" onclick="clearIdleon()">清除</button></div><p id="idleonStatus" role="status">尚未讀取</p><pre id="idleonSummary" style="white-space:pre-wrap;overflow-wrap:anywhere"></pre></div><div class="note">重要：本站不索取 Google 密碼、Idleon 登入權杖，也不假裝 Google 身份登入後就能讀取遊戲資料。真正自動同步還需要經驗證且受授權的遊戲資料介面。</div>`};let firebaseAuth=null,firebaseMod=null;async function initFb(){const el=document.getElementById('fbStatus');try{const cfg=JSON.parse(document.getElementById('fbCfg').value);if(!cfg.apiKey||!cfg.authDomain||!cfg.appId||!cfg.projectId)throw Error('Firebase 欄位不足');const app=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js');firebaseMod=await import('https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js');firebaseAuth=firebaseMod.getAuth(app.initializeApp(cfg,'idleon-guide-'+Date.now()));localStorage.setItem('idleon-firebase-config',JSON.stringify(cfg));el.textContent='Firebase 已初始化；尚未取得 Idleon 資料授權。'}catch(e){el.textContent='初始化失敗：'+e.message}}async function loginFb(){const el=document.getElementById('fbStatus');if(!firebaseAuth)return el.textContent='請先設定 Firebase';try{const user=(await firebaseMod.signInWithPopup(firebaseAuth,new firebaseMod.GoogleAuthProvider())).user;el.textContent='本站已登入：'+(user.displayName||'Google 使用者')+'；Idleon 尚未同步'}catch(e){el.textContent='登入未成功：'+e.message}}async function logoutFb(){if(firebaseAuth)await firebaseMod.signOut(firebaseAuth);document.getElementById('fbStatus').textContent='已登出'}function unpackIdleon(v){if(typeof v!=='string')return v;try{return JSON.parse(v)}catch{return v}}
function idleonReport(d){
 const ids=[...new Set(Object.keys(d).map(k=>k.match(/^Lv0_(\d+)$/)?.[1]).filter(x=>x!==undefined))].map(Number).sort((a,b)=>a-b);
 const out=['【角色資料】'];
 ids.forEach(i=>{const lv=d['Lv0_'+i]||[],q=unpackIdleon(d['QuestComplete_'+i])||{},st=unpackIdleon(d['QuestStatus_'+i])||{},active=(d['QuestHm_'+i]||[]).map(x=>x['0']).filter(Boolean);
 out.push('角色 '+(i+1)+'｜戰鬥等級 '+(lv[0]??'未知')+'｜職業代碼 '+(d['CharacterClass_'+i]??'未知')+'｜目前地圖代碼 '+(d['CurrentMap_'+i]??'未知'));
 out.push('  主線：Scripticus8 '+(q.Scripticus8===1?'已完成':q.Scripticus8===0?'進行中':'未確認')+'；Scripticus10 '+(q.Scripticus10===1?'已完成':q.Scripticus10===0?'進行中':'未確認')+'；正在追蹤 '+(active.length?active.join('、'):'無'));
 if(st.Scripticus10 && q.Scripticus10===0)out.push('  Boss 房間主線狀態：'+JSON.stringify(st.Scripticus10));
 });
 out.push('','【帳號與資源】');
 out.push('目前角色數：'+ids.length);
 out.push('寶石：'+(d.GemsOwned??'無欄位')+'（僅供私人查看）');
 out.push('已擁有的獨特卡片：'+Object.values(unpackIdleon(d.Cards0)||{}).filter(x=>Number(x)>0).length+' 種（依 Cards0 非零數值統計）');
 out.push('W1 鍛造爐等級數據：'+JSON.stringify(d.ForgeLV||[]));
 out.push('W1 鐵砧點數配置：'+ids.map(i=>'角色'+(i+1)+' '+JSON.stringify(d['AnvilPAstats_'+i]||[])).join('；'));
 out.push('W2 煉金大鍋升級：'+(d.CauldUpgLVs||[]).filter(x=>x>0).length+' 項非零；不代表解鎖狀態');
 out.push('W3 印刷：'+(unpackIdleon(d.Print)||[]).filter(x=>typeof x==='number'&&x>0).length+' 個非零產量值；不代表解鎖狀態');
 out.push('','【新手進度提醒】','1. 首要確認角色 1 的 Scripticus10 主線（Boss 房間）與傳送門需求。','2. 檢查 W1 鐵砧、熔爐、郵票與角色技能培養。','3. 存檔包含 W2～W7 的預設欄位，不能直接推斷已解鎖；世界判斷需另外驗證地圖解鎖紀錄。','4. 角色名稱不在目前這份單獨的 cloudsave 資料內，必須另外匯入 charNames。','','資料分析在瀏覽器本機進行；此報告不會上傳。'];
 return out.join('\n');
}
async function importIdleon(){const file=document.getElementById('idleonFile').files[0],status=document.getElementById('idleonStatus');if(!file)return status.textContent='請先選擇 JSON';if(file.size>15e6)return status.textContent='檔案超過 15MB';try{const obj=JSON.parse(await file.text());const data=obj.data&&typeof obj.data==='object'?obj.data:obj;if(!Object.keys(data).some(x=>/^Lv0_\d+$/.test(x)))throw Error('未找到 Lv0_0 等遊戲存檔欄位，請選擇 Raw game data');window.importedIdleon=data;status.textContent='已在本機讀取 Idleon 存檔；以下為可確認的數據和限制';document.getElementById('idleonSummary').textContent=idleonReport(data)}catch(e){status.textContent='解析失敗：'+e.message}}
function clearIdleon(){window.importedIdleon=null;document.getElementById('idleonFile').value='';document.getElementById('idleonStatus').textContent='已清除';document.getElementById('idleonSummary').textContent=''};document.getElementById('search').addEventListener('input',render);render();
</script></body></html>
